name: Docker Publish Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.ahkc.win
      REGISTRY_PROJECT: blob-flow
    steps:
      - uses: actions/checkout@v7

      - name: Compute dev version
        id: version
        run: echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      # Only the moving :main tag is pushed; per-commit tags would pile up
      # in Harbor. Dev builds intentionally omit the
      # NEXT_PUBLIC_UMAMI_WEBSITE_ID build arg so the Umami tracker is left
      # out of the bundle and dev traffic never lands in prod analytics.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/blob-flow-web:main
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
